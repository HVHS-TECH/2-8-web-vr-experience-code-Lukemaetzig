<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap" rel="stylesheet" />
  <title>Instructions</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: 'Nosifer', sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .container {
      padding: 50px 20px;
    }

    .title-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .title-image {
      width: 80px;
      height: auto;
    }

    h1 {
      color: red;
      font-size: 3rem;
      margin: 0;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 60px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .keys {
      display: flex;
      gap: 5px;
    }

    .key {
      background-color: white;
      color: black;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .mouse-icon {
      font-size: 2rem;
    }

    .label {
      color: red;
      margin-top: 10px;
      font-size: 1.2rem;
    }

    .description {
      color: red;
      font-size: 1rem;
      line-height: 1.6;
    }

    .back-button {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: red;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-family: 'Nosifer', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.5s ease;
    }

    .back-button:hover {
      background-color: black;
      color: red;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-button">Back</a>
  <div class="container">
    <div class="title-container">
      <img src="youtube-horror-youtube-thumbnail-removebg-preview.png" alt="Horror Face" class="title-image">
      <h1>INSTRUCTIONS</h1>
    </div>

    <div class="controls">
      <div class="section">
        <div class="keys">
          <div class="key">W</div>
          <div class="key">A</div>
          <div class="key">S</div>
          <div class="key">D</div>
        </div>
        <p class="label">MOVE</p>
      </div>

      <div class="section">
        <div class="key">E</div>
        <p class="label">INTERACT</p>
      </div>

      <div class="section">
        <div class="mouse-icon">🖱</div>
        <p class="label">LOOK AROUND</p>
      </div>
    </div>

    <p class="description">
      YOU RANDOMLY WOKE UP IN THE WOODS. YOU WAKE UP <br />
      NEXT TO A PENTAGRAM...FIND A WAY OUT OF THE WOODS.
    </p>
  </div>
</body>
</html>
