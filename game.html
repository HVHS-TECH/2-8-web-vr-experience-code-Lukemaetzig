<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ritualistic</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body>
    <a-scene cursor="rayOrigin: mouse">

     
      <a-plane rotation="-90 0 0" width="200" height="200" color="#013220" shadow></a-plane>

     
      <a-entity id="player" position="0 1.6 5">
        <a-camera>
          <a-cursor 
            rayOrigin="mouse" 
            fuse="false" 
            material="shader: flat; color: white" 
            position="0 0 -1">
          </a-cursor>
          <a-entity 
            light="type: spot; intensity: 2; angle: 20; penumbra: 0.3; color: #ffffff; distance: 25"
            position="0 0 0" 
            rotation="-10 0 0">
          </a-entity>
        </a-camera>
      </a-entity>

      <a-assests>
        <a-asset-item id
      </a-assests>
      <a-ring 
      position="0 0 -2" 
      rotation="-90 0 0" 
      radius-inner="0.4" 
      radius-outer="0.5" 
      color="red">
    </a-ring>

      
      <a-box id="key" 
             position="10 0.2 -15" 
             depth="0.1" height="0.05" width="0.3" 
             color="gold" 
             class="clickable">
      </a-box>

      <a-box id="car" 
             position="-20 0.5 -40" 
             depth="1.5" height="0.75" width="2.5" 
             color="#222" 
             class="clickable">
      </a-box>

      
      <a-cylinder position="5 1 -10" radius="0.3" height="2" color="#2b2b2b"></a-cylinder>
      <a-sphere position="5 2.5 -10" radius="1" color="#0a0"></a-sphere>

      <a-cylinder position="-8 1 -12" radius="0.3" height="2" color="#2b2b2b"></a-cylinder>
      <a-sphere position="-8 2.5 -12" radius="1" color="#0a0"></a-sphere>

      <a-cylinder position="12 1 -25" radius="0.3" height="2" color="#2b2b2b"></a-cylinder>
      <a-sphere position="12 2.5 -25" radius="1" color="#0a0"></a-sphere>

      <a-cylinder position="-15 1 -35" radius="0.3" height="2" color="#2b2b2b"></a-cylinder>
      <a-sphere position="-15 2.5 -35" radius="1" color="#0a0"></a-sphere>

     
      <a-text id="message" value="Find the Key..." position="0 2 -1" align="center" color="white"></a-text>

      
      <a-sky color="#111"></a-sky>
    </a-scene>

<script>
  let hasKey = false;

  const key = document.querySelector('#key');
  const car = document.querySelector('#car');
  const message = document.querySelector('#message');

  key.addEventListener('click', () => {
    if (!hasKey && key.getAttribute('visible') !== false) {
      hasKey = true;
      key.setAttribute('visible', false);
      console.log('value', 'Key collected!');
    }
  });

  car.addEventListener('click', () => {
    if (hasKey) {
      message.setAttribute('value', 'You escaped!');
      setTimeout(() => {
        window.location.href = 'endScreen.html';
      }, 1000); 
    } else {
      console.log('value', 'You need the key!');
    }
  });
</script>
  </body>
</html>
